spring:
  application:
    name: llmRouter
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 5m


router:
  providers:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.openai.com/v1
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      base-url: https://api.anthropic.com/v1
      anthropic-version: 2023-06-01