spring:
  application:
    name: llmRouter
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 5m


router:
  auth:
    api-keys:
      - ${ROUTER_API_KEY}
  providers:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.openai.com/v1
      models:
        - id: "gpt-3.5-turbo"
          created: 1677610602
          ownedBy: "openai"
          shutdownDate: "2026-10-23"
          max-tokens-param: max_tokens
        - id: "gpt-4o-mini"
          created: 1721172741
          ownedBy: "system"
          shutdownDate: null
          max-tokens-param: max_completion_tokens
        - id: "gpt-5.6-terra"
          created: 1782228459
          ownedBy: "system"
          shutdownDate: null
          max-tokens-param: max_completion_tokens
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      base-url: https://api.anthropic.com/v1
      anthropic-version: 2023-06-01
      models:
        - id: claude-sonnet-4-5